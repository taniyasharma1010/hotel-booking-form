<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Room Booking Form</title>
</head>
<body>

<h1 align="center">Hotel Room Booking Form</h1>

<form id="bookingForm" action="#" method="get" align="center"
      style="width: 340px; margin: 0 auto; padding: 10px; border: 1px solid black; border-top: 4px solid black;">

    <!-- Name -->
    <label for="fullname">Full Name:</label>
    <input type="text" id="fullname" name="fullname" required>
    <br><br>

    <!-- Email -->
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <!-- Phone -->
    <label for="phone">Phone:</label>
    <input type="tel" id="phone" name="phone" required>
    <br><br>

    <!-- Check-in Date -->
    <label for="checkin">Check-in Date:</label>
    <input type="date" id="checkin" name="checkin" required>
    <br><br>

    <!-- Check-out Date -->
    <label for="checkout">Check-out Date:</label>
    <input type="date" id="checkout" name="checkout" required>
    <br><br>

    <!-- Room Type -->
    <label for="roomtype">Room Type:</label>
    <select id="roomtype" name="roomtype">
        <option value="single">Single Room</option>
        <option value="double">Double Room</option>
        <option value="deluxe">Deluxe Room</option>
        <option value="suite">Suite</option>
    </select>
    <br><br>

    <!-- Number of Guests -->
    <label for="guests">Number of Guests:</label>
    <input type="number" id="guests" name="guests" min="1" max="10" style="width: 45px;" required>
    <br><br>

    <!-- Special Requests -->
    <label for="requests">Special Requests:</label>
    <br>
    <textarea id="requests" name="requests" rows="4" cols="35"></textarea>
    <br><br>

    <!-- Buttons -->
    <button type="submit">Book Now</button>
    <button type="reset">Reset Form</button>

</form>

<script>
    document.getElementById("bookingForm").addEventListener("submit", function (event) {
        event.preventDefault(); // stop the page from trying to send data to a server

        var checkin = document.getElementById("checkin").value;
        var checkout = document.getElementById("checkout").value;

        if (checkout <= checkin) {
            alert("Check-out date must be after the check-in date.");
            return;
        }

        alert(
            "Outcome\n\n" +
            "- Successfully created a hotel room booking form webpage using HTML.\n" +
            "- Implemented input fields, labels, select, textarea, and buttons.\n" +
            "- Learned practical form design techniques for web applications."
        );
        this.reset();
    });
</script>

</body>
</html>
